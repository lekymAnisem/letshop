apiVersion: apps/v1
kind: Deployment
metadata:
  name: letshop-backend
  namespace: letshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: letshop-backend
  template:
    metadata:
      labels:
        app: letshop-backend
    spec:
      containers:
        - name: backend
          image: ${ECR_BACKEND_IMAGE}
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: letshop-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: JWT_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: ADMIN_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: AWS_REGION
            - name: AWS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: letshop-secrets
                  key: AWS_BUCKET_NAME
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "128m"
              memory: "256Mi"
            limits:
              cpu: "512m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: letshop-backend
  namespace: letshop
spec:
  selector:
    app: letshop-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
