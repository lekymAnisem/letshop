apiVersion: apps/v1
kind: Deployment
metadata:
  name: letshop-frontend
  namespace: letshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: letshop-frontend
  template:
    metadata:
      labels:
        app: letshop-frontend
    spec:
      containers:
        - name: frontend
          image: ${ECR_FRONTEND_IMAGE}
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "http://letshop-backend:5000/api"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "64m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: letshop-frontend
  namespace: letshop
spec:
  selector:
    app: letshop-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
