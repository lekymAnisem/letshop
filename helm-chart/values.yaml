namespace: letshop

replicas: 2

images:
  backend:
    repository: letshop-production-backend
    tag: latest
    pullPolicy: Always
  frontend:
    repository: letshop-production-frontend
    tag: latest
    pullPolicy: Always

service:
  backend:
    port: 5000
    targetPort: 5000
    type: ClusterIP
  frontend:
    port: 80
    targetPort: 80
    type: LoadBalancer

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
  hosts:
    - paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: letshop-backend
              port: 5000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: letshop-frontend
              port: 80

config:
  PORT: "5000"
  VITE_API_URL: "http://letshop-backend:5000/api"

secrets:
  DATABASE_URL: "postgresql://neondb_owner:npg_dst6w8frMGBW@ep-gentle-truth-a7nq3vek-pooler.ap-southeast-2.aws.neon.tech/neondb?sslmode=require"
  JWT_SECRET: "letshop_jwt_secret_9f8e7d6c5b4a3d2e1f0a9b8c7d6e5f4a3b2c1d0"
  ADMIN_EMAIL: "admin@letshop.com"
  ADMIN_PASSWORD: "Admin123456"
  AWS_ACCESS_KEY_ID: "AKIA5MH4FZNPHGE5Q6AQ"
  AWS_SECRET_ACCESS_KEY: "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"
  AWS_REGION: "ap-southeast-2"
  AWS_BUCKET_NAME: "myshopeeimage"

resources:
  backend:
    requests:
      cpu: "128m"
      memory: "256Mi"
    limits:
      cpu: "512m"
      memory: "512Mi"
  frontend:
    requests:
      cpu: "64m"
      memory: "128Mi"
    limits:
      cpu: "256m"
      memory: "256Mi"

probes:
  backend:
    liveness:
      path: /api/health
      port: 5000
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /api/health
      port: 5000
      initialDelaySeconds: 5
      periodSeconds: 5
  frontend:
    liveness:
      path: /
      port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /
      port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
